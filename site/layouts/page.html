{{ define "main" }}
  <article class="article-page">
    <a class="back-link" href="{{ with site.GetPage .Params.edition }}{{ .RelPermalink }}{{ else }}{{ site.Home.RelPermalink }}{{ end }}">← Torna all’edizione</a>
    <p class="category">{{ .Params.category }} <span aria-hidden="true">/</span> Storia dimostrativa</p>
    <h1>{{ .Title }}</h1>
    <p class="article-summary">{{ .Description }}</p>
    <img src="{{ .Params.image | relURL }}" alt="Illustrazione di una scheda elettronica a bordo di un satellite in orbita">
    <div class="article-prose">{{ .Content }}</div>
  </article>
{{ end }}
